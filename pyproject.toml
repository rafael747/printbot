[project]
name = "printbot"
version = "0.1.0"
description = "WhatsApp bot to handle print jobs and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "pdf2image>=1.17.0",
    "pycups>=2.0.4",
    "pyserial>=3.5",
    "python-escpos>=3.1",
    "python-sane>=2.9.2 ; sys_platform == 'linux'",
    "pywa>=3.8.0",
    "requests>=2.32.5",
    "ruff>=0.15.1",
]
